{% extends "base.html" %}
{% load static %}

{% block content %}
    <main class="container">
        <div class="row">
            <div class="col-6">
                <img src="{{ algorithm.image.url }}" class="algorithm-image" alt=""/>
            </div>
            <div class="col-6 d-flex flex-md-column gap-md-3">
                <h1>{{ algorithm.name }}</h1>
                <span>Описание: {{ algorithm.description }}</span>
                <span>Коэффициент сжатия: {{ algorithm.ratio }} </span>
                <a href="/" class="return-btn btn btn-primary my-4 w-25">
                    Назад
                </a>
            </div>
        </div>
    </main>
{% endblock content %}
