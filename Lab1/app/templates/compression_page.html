{% extends "base.html" %}
{% load static %}

{% block content %}
    <main class="container">
        <h3  class="text-center">Черновое сжатие</h3>
        <div class="form-group">
            <label class="form-label">data_type_label</label>
            <input disabled class="form-control" style="width: 200px" value="{{ compression.data_type }}">
        </div>
        <div class="form-group">
            <label class="form-label">Обьем после сжатия (байт)</label>
            <input disabled class="form-control" style="width: 200px" placeholder="Не рассчитано">
        </div>
        <h4 class="text-center">Алгоритмы</h4>
        <div class="cards-wrapper row">
            {% for algorithm in algorithms %}
                <div class="card w-100">
                     <div class="row g-0 align-items-center px-3">
                        <div class="col-md-3 d-flex justify-content-center">
                            <a href="/algorithms/{{ algorithm.id }}/">
                                <img src="{{ algorithm.image }}" />
                            </a>
                        </div>
                        <div class="col-md-3 align-items-center d-flex flex-column">
                            <p class="card-text text-muted">Название</p>
                            <h5 class="card-title">{{ algorithm.name }}</h5>
                        </div>
                        <div class="col-md-3 align-items-center d-flex flex-column">
                            <p class="card-text text-muted">Коэффициент сжатия</p>
                            <p class="card-text">{{ algorithm.ratio }} </p>
                        </div>
                        <div class="col-md-3 justify-content-center d-flex">
                            <div class="form-group">
                                <label class="form-label">Обьем до сжатия (байт)</label>
                                <input disabled class="form-control" style="width: 150px" value="{{ algorithm.volume }}">
                            </div>
                        </div>
                     </div>
                </div>
            {% endfor %}
        </div>
    </main>
{% endblock content %}
