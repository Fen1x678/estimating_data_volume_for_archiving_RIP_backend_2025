{% extends "base.html" %}

{% block content %}
    <main class="container">
        <div class="row d-flex justify-content-between">
            <div class="col md-8">
                <form class="search-bar" action="/" method="GET">
                    <div class="row">
                        <div class="col-md-8">
                            <input type="text" class="form-control" placeholder="Введите название" name="algorithm_name" value="{{ algorithm_name }}">
                        </div>
                        <div class="col-md-4">
                            <button type="submit" class="btn btn-primary w-100 search-btn">Поиск</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="col md-4 justify-end">
                <a href="/compressions/{{ draft_compression.id }}/" class="w-25">
                    <button type="submit" class="bin btn btn-primary position-relative w-100">
                        <img src="/static/images/cart.png" class="bin-icon">
                        <div class="badge position-absolute badge rounded-pill">
                            {{ algorithms_count }}
                        </div>
                    </button>
                </a>
            </div>
        </div>
        <div class="cards-wrapper">
            {% for algorithm in algorithms %}
                <div class="card">
                    <img src="{{ algorithm.image }}" class="algorithm-preview" alt=""/>
                    <div class="card-body" >
                        <div class="card-info">
                            <h5 class="card-title">{{ algorithm.name }}</h5>
                            <p class="card-text">Коэффициент сжатия: {{ algorithm.ratio }} </p>
                        </div>
                        <div class="card-btns">
                            <a href="/algorithms/{{ algorithm.id }}/" class="btn btn-primary center">
                                Открыть
                            </a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </main>
{% endblock content %}
